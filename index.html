<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Preço Baixo - Peça Aqui</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#f6f6f6;padding-bottom:90px}
  .topo{background:white;text-align:center;padding:15px 10px 5px}
  .topo img{max-width:230px;width:90%}
  .faixa{background:#1a9e4b;color:white;margin:12px;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:18px}
  .faixa a{background:#25D366;color:white;text-decoration:none;padding:8px 12px;border-radius:20px;font-size:14px}
  .filtros{display:flex;gap:8px;padding:0 12px;overflow-x:auto}
  .filtros button{border:2px solid #1a9e4b;background:white;color:#1a9e4b;padding:10px 18px;border-radius:20px;font-weight:bold;font-size:16px;white-space:nowrap;cursor:pointer}
  .filtros button.ativo{background:#d92b2b;border-color:#d92b2b;color:white}
  .titulo{padding:18px 14px 8px;font-size:20px;font-weight:bold}
  .titulo span{color:#666;font-size:13px;display:block;font-weight:normal}
  .card{background:white;margin:0 12px 12px;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
  .card b{font-size:16px}
  .card .preco{color:#1a9e4b;font-size:18px;font-weight:bold;margin:4px 0}
  .qtd{display:flex;align-items:center;gap:8px;margin-top:6px}
  .qtd button{width:30px;height:30px;border-radius:50%;border:none;font-size:18px;font-weight:bold;cursor:pointer;color:white}
  .menos{background:#d92b2b}
  .mais{background:#1a9e4b}
  .add{background:#1a9e4b;color:white;border:none;padding:9px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
  .carrinho{position:fixed;bottom:0;left:0;right:0;background:white;padding:12px;border-top:2px solid #eee;display:flex;justify-content:space-between;align-items:center}
  .carrinho b{font-size:17px}
  .carrinho button{background:#1a9e4b;color:white;border:none;padding:12px 18px;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer}
  .escondido{display:none}
</style>
</head>
<body>

<div class="topo">
  <!-- TROQUE O LINK ABAIXO PELA LOGO DELES -->
  <img src="https://i.imgur.com/logo-exemplo.png" alt="Pizza Preço Baixo">
  <p style="color:#666;margin:6px">Peça aqui, rapidinho!</p>
</div>

<div class="faixa">
  Peça aqui, rapidinho! 🍕
  <a href="https://wa.me/5541996187621" target="_blank">WhatsApp</a>
</div>

<div class="filtros">
  <button class="ativo" onclick="filtrar('todos',this)">Todos</button>
  <button onclick="filtrar('18',this)">R$ 18</button>
  <button onclick="filtrar('25',this)">R$ 25</button>
  <button onclick="filtrar('35',this)">R$ 35</button>
  <button onclick="filtrar('55',this)">R$ 55</button>
</div>

<div id="lista"></div>

<div class="carrinho">
  <div><span id="itens">0 itens</span><br><b id="total">Total: R$ 0,00</b></div>
  <button onclick="finalizar()">Finalizar Pedido</button>
</div>

<script>
const cardapio = [
  {cat:"18", nome:"Alho e óleo", preco:18},
  {cat:"18", nome:"Catupalha", preco:18},
  {cat:"18", nome:"Humita", preco:18},
  {cat:"18", nome:"Milho", preco:18},
  {cat:"25", nome:"3 Queijos", preco:25},
  {cat:"25", nome:"Bacon", preco:25},
  {cat:"25", nome:"Bacon cheddar", preco:25},
  {cat:"25", nome:"Bacon milho", preco:25},
  {cat:"25", nome:"Caipira", preco:25},
  {cat:"25", nome:"Calabresa", preco:25},
  {cat:"25", nome:"Frango", preco:25},
  {cat:"25", nome:"Frango catupiry", preco:25},
  {cat:"25", nome:"Frango cheddar", preco:25},
  {cat:"25", nome:"Frango crocante", preco:25},
  {cat:"25", nome:"Lombo catupiry", preco:25},
  {cat:"25", nome:"Lombo cheddar", preco:25},
  {cat:"25", nome:"Lombo", preco:25},
  {cat:"25", nome:"Mussarela", preco:25},
  {cat:"25", nome:"Marguerita", preco:25},
  {cat:"25", nome:"Romana", preco:25},
  {cat:"25", nome:"Brigadeiro (doce)", preco:25},
  {cat:"25", nome:"Chocolate branco (doce)", preco:25},
  {cat:"25", nome:"Chocolate preto (doce)", preco:25},
  {cat:"25", nome:"Dois amores (doce)", preco:25},
  {cat:"25", nome:"Beijinho (doce)", preco:25},
  {cat:"25", nome:"Prestígio (doce)", preco:25},
  {cat:"35", nome:"4 Queijos", preco:35},
  {cat:"35", nome:"Barcelona", preco:35},
  {cat:"35", nome:"Brócolis", preco:35},
  {cat:"35", nome:"Brócolis com bacon", preco:35},
  {cat:"35", nome:"Calabresa acebolada", preco:35},
  {cat:"35", nome:"Champignon especial", preco:35},
  {cat:"35", nome:"Escarola com bacon", preco:35},
  {cat:"35", nome:"Especial do pizzaiolo", preco:35},
  {cat:"35", nome:"Frango cremoso", preco:35},
  {cat:"35", nome:"Frango especial", preco:35},
  {cat:"35", nome:"Pizza do Lalá", preco:35},
  {cat:"35", nome:"Portuguesa", preco:35},
  {cat:"35", nome:"Banana com canela (doce)", preco:35},
  {cat:"35", nome:"Confetes (doce)", preco:35},
  {cat:"35", nome:"Sedução (doce)", preco:35},
  {cat:"35", nome:"Sensação (doce)", preco:35},
  {cat:"35", nome:"Sonho de valsa (doce)", preco:35},
  {cat:"35", nome:"Banana nevada (doce)", preco:35},
  {cat:"55", nome:"Carnívora", preco:55},
  {cat:"55", nome:"Da casa", preco:55},
  {cat:"55", nome:"Da vovó", preco:55},
  {cat:"55", nome:"Do forneiro (doce)", preco:55},
  {cat:"55", nome:"Leão", preco:55},
  {cat:"55", nome:"Mignon", preco:55},
  {cat:"55", nome:"Mignon a 4 queijos", preco:55},
  {cat:"55", nome:"Mignon acebolado", preco:55},
  {cat:"55", nome:"Mignon alho e óleo", preco:55},
  {cat:"55", nome:"Mignon cheddar", preco:55},
  {cat:"55", nome:"Mignon com brócolis", preco:55},
  {cat:"55", nome:"Strogonoff de carne", preco:55},
  {cat:"55", nome:"Welliton", preco:55},
];

let carrinho = {};
let filtroAtual = 'todos';

function mostrar(){
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  cardapio.forEach((p, i) => {
    if(filtroAtual !== 'todos' && p.cat !== filtroAtual) return;
    const q = carrinho[i] || 0;
    lista.innerHTML += `
    <div class="card">
      <div><b>${p.nome}</b><div class="preco">R$ ${p.preco},00</div>
        <div class="qtd">
          <button class="menos" onclick="mudar(${i},-1)">-</button>
          <span>${q}</span>
          <button class="mais" onclick="mudar(${i},1)">+</button>
        </div>
      </div>
      <button class="add" onclick="mudar(${i},1)">Adicionar +</button>
    </div>`;
  });
}
function mudar(i, v){
  carrinho[i] = Math.max(0, (carrinho[i]||0)+v);
  if(carrinho[i]==0) delete carrinho[i];
  mostrar(); atualizarTotal();
}
function atualizarTotal(){
  let total=0, itens=0;
  for(let i in carrinho){ total += cardapio[i].preco * carrinho[i]; itens += carrinho[i]; }
  document.getElementById('total').innerText = 'Total: R$ ' + total.toFixed(2).replace('.',',');
  document.getElementById('itens').innerText = itens + ' itens';
}
function filtrar(cat, btn){
  filtroAtual = cat;
  document.querySelectorAll('.filtros button').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  mostrar();
}
function finalizar(){
  if(Object.keys(carrinho).length==0){ alert('Escolha pelo menos 1 pizza!'); return; }
  let msg = 'Olá! Quero pedir:%0A';
  let total=0;
  for(let i in carrinho){ msg += `- ${carrinho[i]}x ${cardapio[i].nome} - R$ ${cardapio[i].preco},00%0A`; total += cardapio[i].preco * carrinho[i]; }
  msg += `%0ATotal: R$ ${total},00`;
  window.open('https://wa.me/5541996187621?text='+msg, '_blank');
}
mostrar();
</script>
</body>
</html>
